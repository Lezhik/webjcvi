server:
  port: 8080

spring:
  application:
    name: webjcvi
  ai:
    mcp:
      server:
        name: webjcvi
        version: 0.1.0
        type: SYNC
        instructions: >
          WebJCVI MCP server. Tools operate only inside the project directory
          and enforce a 500 MB per-file size limit. Use regenerate_dna_report,
          read_dna_report, tape_load, tape_find, tape_runs, split_banners,
          pair_drift, unwrap_wraps, rare_islands, cut_tokens, kmer_stamps,
          find_palindromes, extract_spans, fuzzy_find, block_contrast, find_mirrors, flag_seams, phase_mirrors, extract_fields, find_clones, group_prefixes, measure_key_width, find_forks, compare_affixes, profile_lanes, profile_rows, profile_cliffs, profile_runways, profile_rises, profile_majorities, profile_nears, analyze_logs, list_files, and read_file. Caller-text tools
          (tape, split, drift, unwrap, rare, tokens, stamps, fold, loop, fuzzy, contrast, mirrors, seams, phase, fields, clones, prefixes, keys, forks, affixes, lanes, rows, cliffs, runways, rises, majorities, nears, log analysis) operate
          on in-memory text, not DNA and not project files.
        annotation-scanner:
          enabled: false
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false

gg:
  jte:
    development-mode: true
    template-location: src/main/jte
    template-suffix: .jte
    # Compiled templates go to build/jte-classes via JteTemplateConfiguration
    # (the starter otherwise writes jte-classes at the project root).

webjcvi:
  storage:
    max-file-size-bytes: 524288000
  dna:
    relative-path: jcvi-dna.txt
  report:
    directory: build/reports/dna
    file-name: dna-report.md

logging:
  level:
    org.webjcvi: DEBUG
